allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Build output goes to <repo>/build, as in the Flutter template.
// layout.buildDirectory.dir() resolves against the default build directory
// (android/build), hence "../../build".
def newBuildDir = rootProject.layout.buildDirectory.dir('../../build').get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Adds androidx.concurrent:concurrent-futures to every Android module,
// including each Flutter plugin module; :app also declares it. This was added
// in cd39097 without a recorded reason (the CameraX/Guava ListenableFuture
// plumbing in camera_android_camerax is the likely consumer). Keep it until a
// debug and a release build have been verified without it.
subprojects { subproject ->
    def addConcurrentFuturesDependency = {
        subproject.dependencies.add(
                'implementation',
                'androidx.concurrent:concurrent-futures:1.1.0'
        )
    }

    subproject.pluginManager.withPlugin('com.android.application', addConcurrentFuturesDependency)
    subproject.pluginManager.withPlugin('com.android.library', addConcurrentFuturesDependency)
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
