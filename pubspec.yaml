name: motocam
description: Motorcycle dashcam app with GPS route logging
version: 1.0.1+13

environment:
  # Floor taken from the `sdks` section of pubspec.lock; the project is
  # developed and tested on Flutter 3.41.2 / Dart 3.11.0.
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Camera
  camera: ^0.12.0
  # Used directly for the segment-roll flag of the vendored plugin (see
  # dependency_overrides below).
  camera_android_camerax: ^0.7.2
  camera_platform_interface: ^2.15.0
  
  # Location
  geolocator: ^14.0.2
  
  # Sensors
  sensors_plus: ^7.0.0
  
  # Storage
  path_provider: ^2.1.1
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  crypto: ^3.0.6

  # Playback
  video_player: ^2.10.0

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.3
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# camera_android_camerax 0.7.2 is vendored with MotoCam patches (segment rolls
# keep the video stream bound; the preview surface is released before the engine
# detaches). See third_party/camera_android_camerax/MOTOCAM_PATCHES.md.
# sensors_plus 7.1.1 is vendored so slow sensor streams are averaged off the
# main thread. See third_party/sensors_plus/MOTOCAM_PATCHES.md.
dependency_overrides:
  camera_android_camerax:
    path: third_party/camera_android_camerax
  sensors_plus:
    path: third_party/sensors_plus

flutter:
  uses-material-design: true